<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Social | CoCoMokio</title>
        <link rel="shortcut icon" href="Images/CMC logo.svg" type="image/svg+xml">
        <link rel="stylesheet" href="DarkStyles.css">
        <script src="scripts/site.js" defer></script>
        <script src="scripts/socials.js" defer></script>
    </head>
    <body>
        <div data-shared-header data-title="Social" data-title-class="page-title" data-title-href="/" data-account-links></div>
        <main class="social-page">
            <section class="social-section" aria-labelledby="owner-heading">
                <h2 class="social-section-title" id="owner-heading">Owner</h2>
                <div class="social-grid" data-social-profiles="owner"></div>
            </section>
            
            <section class="social-section" aria-labelledby="media-heading">
                <h2 class="social-section-title media-section-title" id="media-heading">Media</h2>
                <!-- <div class="social-grid" data-social-profiles="media"></div> -->
            </section>
            <div class="developer-callout">
                <span class="developer-callout-label">NOW RECRUITING</span>
                <p>We're looking for our next Media! Want to help build Mokio?</p>
                <a class="developer-callout-link" href="https://www.cocomokio.com/pages/apply.html">Apply to join the Media team <span aria-hidden="true">→</span></a>
            </div>
            <p class="social-live-note">Twitch live status refreshes automatically. Add real media names, profile links, and Twitch usernames in <code>scripts/socials.js</code>.</p>
        </main>
        <div data-shared-footer></div>
    </body>
</html>
